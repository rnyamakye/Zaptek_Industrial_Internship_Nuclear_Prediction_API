$kind: http-request
url: "{{base_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Health endpoint returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Health response is not empty", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
    language: text/javascript
order: 1000
