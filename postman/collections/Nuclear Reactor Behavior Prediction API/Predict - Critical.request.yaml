$kind: http-request
url: "{{base_url}}/predict"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "enrichment_percent": 3.7,
      "fuel_density": 10.5,
      "moderator_density": 0.7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Prediction endpoint returns 200", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();

      pm.test("Response contains predicted_k_eff", function () {
          pm.expect(response).to.have.property("k_eff");
      });

      pm.test("Response contains predicted_reactor_status", function () {
          pm.expect(response).to.have.property("reactor_status");
      });

      pm.test("predicted_k_eff is a number", function () {
          pm.expect(response.k_eff).to.be.a("number");
      });

      pm.test("Reactor status is Critical", function () {
          pm.expect(response.reactor_status.toLowerCase()).to.eql("critical");
      });
    language: text/javascript
order: 3000
