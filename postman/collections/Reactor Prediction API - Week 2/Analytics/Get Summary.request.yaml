$kind: http-request
description: "Overall stats: total predictions, status breakdown, and averages. Admins see all users' data by default (optional ?user_id= to narrow); regular users see only their own."
url: '{{base_url}}/analytics/summary'
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Analytics summary returns 200", function () { pm.response.to.have.status(200); });
      pm.test("Has total_predictions field", function () { pm.expect(pm.response.json()).to.have.property("total_predictions"); });
    language: text/javascript
order: 1000
