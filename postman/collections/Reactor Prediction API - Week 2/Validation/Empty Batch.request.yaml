$kind: http-request
url: '{{base_url}}/predictions/batch'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: "[]"
scripts:
  - type: afterResponse
    code: pm.test("Empty batch returns 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
